<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#D4365C"/>
    </linearGradient>
  </defs>

  <!--
    Room outline with opening on the right.
    Drawn as a single path — no masking needed.
    Starts bottom-right of the gap, goes clockwise around, ends top-right of the gap.
  -->
  <path d="
    M 448 316
    Q 448 448, 320 448
    L 192 448
    Q 64 448, 64 320
    L 64 192
    Q 64 64, 192 64
    L 320 64
    Q 448 64, 448 192
    L 448 196
  " stroke="url(#grad)" stroke-width="36" stroke-linecap="round" fill="none"/>

  <!-- Door leaf — angled lines forming a > shape (door swung inward) -->
  <path d="
    M 448 196
    L 380 256
    L 448 316
  " stroke="url(#grad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Minimal table dots — three seats around a table -->
  <circle cx="220" cy="240" r="22" fill="url(#grad)" opacity="0.85"/>
  <circle cx="280" cy="200" r="14" fill="url(#grad)" opacity="0.45"/>
  <circle cx="280" cy="280" r="14" fill="url(#grad)" opacity="0.45"/>
</svg>
