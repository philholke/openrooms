# Production docker-compose overlay.
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Required: Set all environment variables in a .env file or via your deployment
# platform. See backend/.env.example for the full list.
#
# This overlay:
#   - Removes dev volume mounts
#   - Adds resource limits and restart policies
#   - Uses the readiness endpoint for health checks
#   - Does NOT expose the database port

services:
  db:
    ports: []  # Do not expose Postgres externally in production
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  backend:
    restart: always
    volumes: []  # Remove dev volume mount
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
      CORS_ORIGINS: ${CORS_ORIGINS}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health/ready\")'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  frontend:
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
